<style>
:root{--bg:#0a0e14;--surface:#131a24;--border:#263243;--text:#f1f4f8;--muted:#9aa7b8;--accent:#fe5f05;--on-accent:#1d0d00;--danger:#ff7068;--ring:rgba(254,95,5,.3);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f2f4f7;--surface:#ffffff;--border:#d0d7e0;--text:#0f1722;--muted:#536074;--accent:#fe5f05;--danger:#c02c26;--ring:rgba(254,95,5,.26)}}
:root[data-theme="light"]{--bg:#f2f4f7;--surface:#ffffff;--border:#d0d7e0;--text:#0f1722;--muted:#536074;--accent:#fe5f05;--danger:#c02c26;--ring:rgba(254,95,5,.26)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin:4px 0 8px}
.brand svg{display:block}
.brand .c{width:74px;height:79px;color:var(--accent)}
.brand .word{width:auto;height:31px}
.brand .it{fill:var(--accent)}
.tag{margin:0 0 20px;color:var(--text);font-size:16.5px;text-align:center}
p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.pw{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text)}
.pw:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.keep{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-weight:400;font-size:15px;color:var(--muted);cursor:pointer}
.keep input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
button{width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px 14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.75;cursor:progress;filter:none}
.err{color:var(--danger);font-size:14.5px;margin:10px 0 0;min-height:1.4em}
.vh,.user{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
[hidden]{display:none!important}
</style>
</head>

<script>
// Everything stays inside this function: the app replaces this page in the same window, so nothing here may claim a global name.
(() => {
  const D = JSON.parse(document.getElementById('gate-data').textContent), KEY = 'countit-gate';
  const el = (id) => document.getElementById(id);
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u) => { let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const box = (kind) => { try { return kind === 'local' ? window.localStorage : window.sessionStorage; } catch (e) { return null; } };
  const recall = (kind) => { try { const v = JSON.parse(box(kind).getItem(KEY) || 'null'); return v && v.salt === D.salt ? v.key : null; } catch (e) { return null; } };
  const remember = (kind, key) => { try { box(kind).setItem(KEY, JSON.stringify({ salt: D.salt, key })); } catch (e) {} };
  const forget = () => { for (const kind of ['local', 'session']) try { box(kind).removeItem(KEY); } catch (e) {} };
  try { // match the app's light/dark choice
    const s = JSON.parse(localStorage.getItem('countit.v1') || 'null'), t = s && s.settings && s.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
  // Keep a copy of this page on the device so it opens with no signal (see sw.js).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const derive = async (pw) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return b64(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.salt), iterations: D.rounds }, base, 256)));
  };
  const unlock = async (key) => {
    const k = await crypto.subtle.importKey('raw', bytes(key), 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, k, bytes(D.ct)));
  };
  // Swap this page for the app. Wait until this page has finished loading: a browser still reading it would mix the
  // app in under the sign-in screen instead of replacing it. Afterwards, #signout in the address bar still signs out.
  const open = async (html) => {
    if (document.readyState !== 'complete') await new Promise((done) => window.addEventListener('load', done, { once: true }));
    document.open(); document.write(html); document.close();
    window.addEventListener('hashchange', () => { if (location.hash === '#signout') { forget(); location.replace(location.pathname + location.search); } });
  };
  const ask = (msg) => { el('gate').hidden = false; el('gate-err').textContent = msg || ''; el('gate-pw').focus(); };
  if (!window.crypto || !crypto.subtle) { ask('Open this page with https:// to sign in.'); el('gate-go').disabled = true; return; }
  if (location.hash === '#signout') { forget(); history.replaceState(null, '', location.pathname + location.search); }
  const saved = recall('local') || recall('session');
  if (saved) unlock(saved).then(open, () => { forget(); ask(); }); else ask();
  el('gate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = el('gate-go'), pw = el('gate-pw');
    go.disabled = true; go.textContent = 'Opening…'; el('gate-err').textContent = '';
    let html, key;
    try { key = await derive(pw.value); html = await unlock(key); } catch (err) {
      go.disabled = false; go.textContent = 'Open Count It';
      ask("That password isn't right. Try again."); pw.select(); return;
    }
    forget(); remember(el('gate-keep').checked ? 'local' : 'session', key);
    open(html);
  });
})();
</script>
